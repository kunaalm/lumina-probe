services:
  luminance-probe:
    container_name: lumina-probe
    restart: unless-stopped
    image: ghcr.io/kunaalm/lumina-probe:latest
    # Host networking: reach Frigate (this host, :5001) and the MQTT broker
    # (192.168.20.12:1883) without bridge/NAT gymnastics.
    network_mode: host
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # Mount the config FILE at the path the image expects (default --config /app/config.yaml).
      # PITFALL: mounting the ./config DIRECTORY (./config:/app/config) leaves the file
      # at /app/config/config.yaml, which the entrypoint never reads -> exit 2 crash-loop.
      - ./config/config.yaml:/app/config.yaml:ro
    environment:
      # Broker auth; can live here or in config.yaml
      MQTT_PASSWORD: "mqtt"
