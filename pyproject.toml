[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luminance-probe"
version = "0.1.0"
description = "Measure average luminance of image sources and publish to MQTT with Home Assistant discovery."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kunaal Mahanti" }]
keywords = ["luminance", "mqtt", "home-assistant", "camera", "iot"]
dependencies = [
    "Pillow>=10.0",
    "paho-mqtt>=2.0",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
luminance-probe = "luminance_probe.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
