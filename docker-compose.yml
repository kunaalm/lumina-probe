services:
  luminance-probe:
    image: ghcr.io/kunaalm/luminance-probe:latest
    container_name: luminance-probe
    restart: unless-stopped
    volumes:
      - ./config/config.yaml:/app/config.yaml:ro
    environment:
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
    network_mode: host   # simplest for reaching brokers/cameras on arbitrary LAN IPs
